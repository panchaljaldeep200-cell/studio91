<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Studio91</title>
    <meta name="description" content="Welcome to Studio91 | Luxury Wedding Photography">
    <link rel="stylesheet" href="css/style.css?v=6">
    <!-- Font Awesome for arrows and icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Specific styles for Welcome Page */
        .welcome-hero {
            position: relative;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #000;
        }

        .welcome-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            color: var(--color-white);
            width: 90%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .welcome-logo {
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            animation: fadeInUp 1s ease forwards;
        }

        .welcome-description {
            font-size: clamp(1.2rem, 2vw, 1.5rem);
            font-family: var(--font-alt);
            font-weight: 300;
            margin-bottom: 3rem;
            line-height: 1.6;
            animation: fadeInUp 1.5s ease forwards;
            animation-delay: 0.3s;
            opacity: 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            color: var(--color-white);
        }

        .welcome-btn {
            display: inline-block;
            padding: 1rem 3rem;
            border: 1px solid var(--color-white);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            color: var(--color-white);
            font-family: var(--font-alt);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: var(--transition-smooth);
            animation: fadeInUp 1.5s ease forwards;
            animation-delay: 0.6s;
            opacity: 0;
        }

        .welcome-btn:hover {
            background: var(--color-white);
            color: var(--color-text-main);
        }

        .welcome-hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 5;
        }

        .top-logo {
            position: absolute;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            color: var(--color-white);
            font-size: clamp(2.5rem, 4vw, 3.5rem);
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: fadeInUp 1s ease forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body style="overflow: hidden;">

    <!-- Welcome Slider -->
    <section class="hero-slider welcome-hero" style="padding: 0;">
        <div id="welcome-hero-slides" style="position: absolute; inset: 0; z-index: 1;">
            <div class="slide active" style="background-image: url('images/hero/hero-01.jpg');"></div>
            <div class="slide" style="background-image: url('images/hero/hero-02.jpg');"></div>
            <div class="slide" style="background-image: url('images/hero/hero-03.jpg');"></div>
            <div class="slide" style="background-image: url('images/hero/hero-04.jpg');"></div>
            <div class="slide" style="background-image: url('images/hero/hero-05.jpg');"></div>
        </div>

        <div class="welcome-content" style="z-index: 20;">
            <div
                style="font-size: clamp(2.5rem, 4vw, 3.5rem); font-weight: 600; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 1rem; font-family: var(--font-alt);">
                STUDIO91</div>
            <h1 class="welcome-logo"
                style="font-family: var(--font-main); font-size: clamp(3rem, 5vw, 5rem); text-transform: uppercase; margin-bottom: 1rem;">
                Welcome</h1>
            <p class="welcome-description">
                Timeless, authentic, and cinematic wedding photography capturing the moments you'll cherish forever.
            </p>
            <a href="home.html" class="welcome-btn">Welcome</a>
        </div>
    </section>

    <!-- 3D Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/content-data.js"></script>
    <script src="js/images-data.js"></script>
    <script src="js/videos-data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
